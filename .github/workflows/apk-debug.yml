name: APK (debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: APK smoke check (package, no INTERNET)
        run: bash tools/check_apk.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: doc-scanner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: Job summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Debug APK"
            echo ""
            echo "[Download the APK artifact]($ARTIFACT_URL) (kept 14 days, sign in to GitHub to download)."
            echo ""
            echo "Debug build, not for release."
          } >> "$GITHUB_STEP_SUMMARY"
