name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Style, static analysis, lint, tests, debug build
        run: ./gradlew ktlintCheck detekt lint check assembleDebug --stacktrace
      - name: APK smoke check (package, no INTERNET)
        run: bash tools/check_apk.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            ./gradlew -q :koverLog 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore
