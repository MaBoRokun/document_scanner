name: Release

on:
  push:
    tags: ['v*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  android:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release (APK + AAB)
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Build debug-signed fallback (no signing secrets present)
        if: env.HAS_KEYSTORE != 'true'
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Collect artifacts
        run: |
          mkdir dist
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk "dist/doc-scanner-$TAG.apk"
            cp app/build/outputs/bundle/release/*.aab "dist/doc-scanner-$TAG.aab"
          else
            cp app/build/outputs/apk/debug/*.apk "dist/doc-scanner-$TAG-DEBUG-SIGNED-NOT-FOR-RELEASE.apk"
          fi
      - name: APK smoke check (package, no INTERNET)
        run: |
          for apk in dist/*.apk; do bash tools/check_apk.sh "$apk"; done
      # Published from this job: no artifact hop, so it does not depend on Actions artifact storage.
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
